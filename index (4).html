<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPTA Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0d2c6b; --green:#1f8a3b; --bg:#f4f7fb; --text:#16233b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans Bengali", system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  header { background:var(--navy); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:4px solid var(--green); }
  header .brand { font-weight:700; font-size:1.1rem; }
  .lang button { background:#fff; color:var(--navy); border:0; border-radius:8px; padding:10px 16px; font-size:1rem; font-weight:700; cursor:pointer; min-height:44px; }
  .lang button:focus-visible { outline:3px solid var(--green); outline-offset:2px; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; text-align:center; }
  main img { width:min(260px, 70vw); height:auto; }
  h1 { color:var(--navy); font-size:1.5rem; margin:16px 0 4px; }
  .sub { margin:0 0 24px; color:#3b4a66; }
  .card { background:#fff; border:1px solid #d6deec; border-radius:12px; padding:16px; text-align:left; margin-bottom:16px; }
  .card h2 { margin:0 0 8px; font-size:1.05rem; color:var(--navy); }
  #status { font-weight:600; }
  .ok { color:var(--green); } .bad { color:#b3261e; } .wait { color:#6b7a99; }
  .note { font-size:.9rem; color:#4a5875; }
</style>
</head>
<body>
<header>
  <span class="brand">KPTA Portal</span>
  <div class="lang"><button id="langBtn" type="button">English</button></div>
</header>

<main>
  <img src="logo.png" alt="KPTA Portal logo">
  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="subtitle"></p>

  <section class="card" aria-live="polite">
    <h2 data-i18n="checkTitle"></h2>
    <div id="status" class="wait"></div>
  </section>

  <p class="note" data-i18n="disclaimer"></p>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBXnUBaghSoZTqXkOZteEhsXavFS-QU1rU",
    authDomain: "kpta-portal.firebaseapp.com",
    projectId: "kpta-portal",
    storageBucket: "kpta-portal.firebasestorage.app",
    messagingSenderId: "541726824700",
    appId: "1:541726824700:web:57ce2d973caf7ef5fe1f79"
  };

  const T = {
    bn: {
      title: "Kalukhali Primary Teachers’ Attendance Portal",
      subtitle: "কালুখালী প্রাথমিক বিদ্যালয়ের শিক্ষক হাজিরা পোর্টাল",
      checkTitle: "সিস্টেম সংযোগ পরীক্ষা",
      checking: "পরীক্ষা চলছে…",
      ok: "✔ ডেটাবেসের সাথে সংযোগ ঠিক আছে এবং ডেটা সুরক্ষিত (তালাবদ্ধ) আছে।",
      fail: "✖ সংযোগ হয়নি। ইন্টারনেট দেখুন বা আমাকে জানান।",
      disclaimer: "এটি একটি পরীক্ষামূলক পোর্টাল। এটি সরকারিভাবে অনুমোদিত ওয়েবসাইট নয়।",
      btn: "English"
    },
    en: {
      title: "Kalukhali Primary Teachers’ Attendance Portal",
      subtitle: "Kalukhali Primary School Teachers’ Attendance Portal",
      checkTitle: "System connection check",
      checking: "Checking…",
      ok: "✔ Connected to the database, and the data is protected (locked).",
      fail: "✖ Could not connect. Check the internet or tell the developer.",
      disclaimer: "This is a trial portal. It is not an officially authorized government website.",
      btn: "বাংলা"
    }
  };

  let lang = localStorage.getItem("kpta_lang") || "bn";
  let state = "wait";

  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
    document.getElementById("langBtn").textContent = T[lang].btn;
    const s = document.getElementById("status");
    s.textContent = T[lang][state === "wait" ? "checking" : state];
    s.className = state === "ok" ? "ok" : state === "fail" ? "bad" : "wait";
  }

  document.getElementById("langBtn").addEventListener("click", () => {
    lang = lang === "bn" ? "en" : "bn";
    try { localStorage.setItem("kpta_lang", lang); } catch (e) {}
    render();
  });

  render();

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    await getDoc(doc(db, "ping", "test"));
    state = "ok";
  } catch (e) {
    // "permission-denied" means we reached the server and the lock works.
    state = (e && e.code === "permission-denied") ? "ok" : "fail";
  }
  render();
</script>
</body>
</html>
